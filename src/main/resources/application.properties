# PostgreSQL R2DBC Configuration
spring.r2dbc.url=r2dbc:postgresql://localhost:5432/lecture6db
spring.r2dbc.username=postgres
spring.r2dbc.password=postgres

# Flyway DISABLED - using Testcontainers for testing
spring.flyway.enabled=false

# Server Configuration
server.port=8080

# Logging
logging.level.root=INFO
logging.level.com.example.lecture6=DEBUG
logging.level.io.r2dbc.postgresql=DEBUG
